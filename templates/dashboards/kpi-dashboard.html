<style>
/* ===== 토큰 (DESIGN.md 2~3장) ===== */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: local("Pretendard Variable"), url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations"), url("../assets/fonts/PretendardVariable.woff2") format("woff2");
}
@font-face {
  font-family: "Geist Mono";
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
  src: local("Geist Mono"), url("../assets/fonts/GeistMono.woff2") format("woff2");
}
:root {
  --bg: #FFFFFF;
  --surface: #F6F7F8;
  --border: #E4E6E9;
  --text: #111315;
  --text-muted: #5D636B;
  --accent: #0F6E5C;
  --accent-contrast: #FFFFFF;
  /* 상태 색: DESIGN.md 2장 "채도를 낮춘 색, 강조색과 겹치지 않게" */
  --negative: #A2413A;
  --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0C0E; --surface: #141619; --border: #25282D; --text: #ECEDEF;
    --text-muted: #9AA0A8; --accent: #3FB59A; --accent-contrast: #06231D; --negative: #E3877F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0C0E; --surface: #141619; --border: #25282D; --text: #ECEDEF;
  --text-muted: #9AA0A8; --accent: #3FB59A; --accent-contrast: #06231D; --negative: #E3877F;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
.skip { position: absolute; left: 16px; top: -100px; z-index: 100; background: var(--accent); color: var(--accent-contrast); padding: 8px 16px; border-radius: 8px; font-weight: 600; }
.skip:focus-visible { top: 12px; text-decoration: none; }

html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scroll-padding-top: 88px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.7;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 20px; height: 20px; flex: none; fill: currentColor; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
@media (min-width: 1024px) { .wrap { padding: 0 32px; } }

/* 머리 */
.top { border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 68px; }
.top .crumb { flex: 1; min-width: 0; font-size: 14px; color: var(--text-muted); }
.top .crumb b { color: var(--text); font-weight: 600; }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
  border-radius: 8px; border: 1px solid var(--border); color: var(--text); background: transparent;
  transition: background-color 200ms var(--ease);
}
.btn-icon:hover { background: var(--surface); text-decoration: none; }

.head { padding: 48px 0 32px; display: grid; gap: 24px; grid-template-columns: 1fr auto; align-items: end; }
.head h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
@media (min-width: 1024px) { .head h1 { font-size: 44px; } }
.head p { margin: 8px 0 0; color: var(--text-muted); font-size: 14px; }
@media (max-width: 767px) { .head { grid-template-columns: 1fr; padding-top: 32px; } }

/* 기간 선택 (한 줄 필터) */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; background: var(--surface); }
.seg button {
  height: 36px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer;
  transition: background-color 200ms var(--ease), color 200ms var(--ease);
  touch-action: manipulation;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }

/* 12열 그리드 */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; padding-bottom: 96px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
@media (max-width: 1023px) { .span-3 { grid-column: span 6; } .span-4, .span-8 { grid-column: span 12; } }
@media (max-width: 599px) { .span-3 { grid-column: span 12; } .grid { gap: 16px; } }

.panel { border: 1px solid var(--border); border-radius: 12px; padding: 24px; min-width: 0; }
.panel-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; }
.panel h2 + p { margin: 2px 0 0; font-size: 14px; color: var(--text-muted); }
.link-btn { border: 0; background: none; padding: 8px 0; font: inherit; font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.link-btn:hover { text-decoration: underline; }

/* 지표 타일 */
.stat .label { font-size: 14px; color: var(--text-muted); margin: 0; }
.stat .value { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 8px 0 4px; }
.stat .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; }
.stat .delta .icon { width: 16px; height: 16px; }
.delta.good { color: var(--accent); }
.delta.bad { color: var(--negative); }
.stat .vs { font-size: 13px; color: var(--text-muted); margin-left: 4px; font-weight: 400; }
.spark { display: block; width: 100%; height: 40px; margin-top: 16px; overflow: visible; }
.spark polyline { fill: none; stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.6; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }

/* 차트 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--border); stroke-width: 1; }
.chart .tick { fill: var(--text-muted); font-size: 12px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .s-cur { stroke: var(--accent); }
.chart .s-prev { stroke: var(--text-muted); }
.chart .area { fill: var(--accent); opacity: 0.1; }
.chart .end { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.chart .end-label { fill: var(--text); font-size: 13px; font-weight: 600; font-family: var(--font); }
.chart .cross { stroke: var(--text-muted); stroke-width: 1; opacity: 0; }
.chart .hover-dot { opacity: 0; stroke: var(--bg); stroke-width: 2; }
.chart.is-hover .cross, .chart.is-hover .hover-dot { opacity: 1; }
.chart .bar { fill: var(--accent); }
.chart .bar-hit { fill: transparent; cursor: default; }
.chart .bar-row:hover .bar, .chart .bar-row:focus-visible .bar { fill: color-mix(in srgb, var(--accent) 80%, var(--text)); }
.chart .bar-row { outline: none; }
.chart .bar-val { fill: var(--text); font-size: 15px; font-weight: 600; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .bar-name { fill: var(--text); font-size: 15px; font-family: var(--font); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 140px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  padding: 8px 12px; font-size: 13px; line-height: 1.5; opacity: 0; transition: opacity 150ms var(--ease);
}
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 600; margin-bottom: 4px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
.tip .key { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); }
.tip .key i { width: 10px; height: 2px; display: inline-block; }
.legend { display: flex; gap: 16px; list-style: none; margin: 0 0 12px; padding: 0; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 16px; height: 2px; display: inline-block; }

/* 표 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 12px 16px 12px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
thead th { font-size: 13px; font-weight: 600; color: var(--text-muted); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; padding-left: 16px; }
tbody tr:last-child td { border-bottom: 0; }
.meter { display: inline-block; vertical-align: middle; width: 80px; height: 6px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; margin-right: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
/* ===== 데이터: 이 부분만 바꾸면 됩니다 ===== */
const MONTHS = ['10월','11월','12월','1월','2월','3월','4월','5월','6월','7월','8월','9월'];
const DATA = {
  revenue:     [18.2, 21.5, 24.8, 17.1, 16.4, 18.9, 19.6, 20.3, 21.0, 22.4, 23.1, 24.6], // 억 원, 최근 12개월
  revenuePrev: [15.9, 18.7, 21.2, 15.0, 14.6, 16.1, 16.8, 17.4, 18.1, 18.9, 19.5, 20.2],
  orders:      [41200, 48900, 55100, 38800, 36900, 42300, 43800, 45100, 46600, 49200, 50400, 53100],
  cvr:         [2.6, 2.9, 3.1, 2.5, 2.4, 2.7, 2.8, 2.8, 2.9, 3.0, 3.0, 3.2], // %
  ret:         [6.8, 7.4, 8.1, 7.0, 6.6, 6.4, 6.3, 6.1, 6.0, 5.9, 5.8, 5.6], // %
  channels: {  // 12개월 / 6개월 합계 비중 (%)
    12: [['자사 앱', 41], ['자사 웹', 24], ['오픈마켓', 19], ['소셜 커머스', 11], ['기타', 5]],
    6:  [['자사 앱', 45], ['자사 웹', 22], ['오픈마켓', 18], ['소셜 커머스', 11], ['기타', 4]]
  },
  products: {
    12: [['경량 패딩 조끼','의류',9.8,21400,92],['데일리 러닝화','신발',8.1,13200,78],['캐시미어 머플러','잡화',6.4,18900,85],['방수 백팩 24L','가방',5.2,8700,64],['울 니트 카디건','의류',4.9,9600,71]],
    6:  [['데일리 러닝화','신발',4.6,7500,81],['경량 패딩 조끼','의류',3.9,8600,88],['린넨 셔츠','의류',3.1,9100,94],['방수 백팩 24L','가방',2.8,4700,66],['스포츠 양말 5족','잡화',2.2,15800,59]]
  }
};
/* ======================================== */

const $ = (s, el = document) => el.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const fmt = new Intl.NumberFormat('ko-KR');
const svgEl = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => sum(a) / a.length;
// 기간은 주소(?range=6)에도 남겨, 새로고침하거나 링크를 공유해도 유지됩니다
let range = new URLSearchParams(location.search).get('range') === '6' ? 6 : 12;

function renderKpis() {
  const n = range, cur = a => a.slice(-n), prev = a => a.slice(-2 * n, -n);
  const rev = sum(cur(DATA.revenue)), revPrev = sum(DATA.revenuePrev.slice(-n));
  const ord = sum(cur(DATA.orders));
  const ordPrev = n === 6 ? sum(prev(DATA.orders)) : ord / 1.14; // 12개월 비교값이 없으면 전년 성장률로 추정
  const cvr = avg(cur(DATA.cvr)), cvrPrev = n === 6 ? avg(prev(DATA.cvr)) : 2.5;
  const ret = avg(cur(DATA.ret)), retPrev = n === 6 ? avg(prev(DATA.ret)) : 7.2;
  const tiles = {
    rev: [rev.toFixed(1) + '억 원', (rev / revPrev - 1) * 100, '%', true, '작년 같은 기간'],
    orders: [fmt.format(Math.round(ord)) + '건', (ord / ordPrev - 1) * 100, '%', true, n === 6 ? '직전 6개월' : '작년 같은 기간'],
    cvr: [cvr.toFixed(1) + '%', cvr - cvrPrev, '%p', true, n === 6 ? '직전 6개월' : '작년 같은 기간'],
    ret: [ret.toFixed(1) + '%', ret - retPrev, '%p', false, n === 6 ? '직전 6개월' : '작년 같은 기간']
  };
  for (const k in tiles) {
    const [value, d, unit, upIsGood, vs] = tiles[k];
    $(`[data-kpi="${k}"]`).textContent = value;
    const good = (d >= 0) === upIsGood;
    const el = $(`[data-delta="${k}"]`);
    el.className = 'delta ' + (good ? 'good' : 'bad');
    el.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-${d >= 0 ? 'up' : 'down'}"/></svg>${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(1)}${unit}<span class="vs">${vs} 대비</span>`;
    const series = { rev: DATA.revenue, orders: DATA.orders, cvr: DATA.cvr, ret: DATA.ret }[k].slice(-n);
    const sp = $(`[data-spark="${k}"]`); sp.replaceChildren();
    const mn = Math.min(...series), mx = Math.max(...series);
    const pts = series.map((v, i) => [i / (series.length - 1) * 200, 36 - (v - mn) / (mx - mn || 1) * 32]);
    svgEl('polyline', { points: pts.map(p => p.join(',')).join(' ') }, sp);
    const last = pts[pts.length - 1];
    svgEl('circle', { cx: last[0], cy: last[1], r: 4 }, sp);
  }
}

function renderLine() {
  const n = range, labels = MONTHS.slice(-n), cur = DATA.revenue.slice(-n), prev = DATA.revenuePrev.slice(-n);
  const box = $('#line'), svg = $('svg', box), tip = $('.tip', box);
  svg.replaceChildren();
  const W = 720, H = 280, L = 40, R = 56, T = 16, B = 32;
  const max = 30, x = i => L + i * (W - L - R) / (n - 1), y = v => T + (1 - v / max) * (H - T - B);
  for (let t = 0; t <= max; t += 10) {
    svgEl('line', { class: 'gridline', x1: L, x2: W - R, y1: y(t), y2: y(t) }, svg);
    svgEl('text', { class: 'tick', x: L - 8, y: y(t) + 4, 'text-anchor': 'end' }, svg).textContent = t;
  }
  labels.forEach((m, i) => {
    if (n === 12 && i % 2) return;
    svgEl('text', { class: 'tick', x: x(i), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = m;
  });
  const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join('');
  svgEl('path', { class: 'area', d: path(cur) + `L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z` }, svg);
  svgEl('path', { class: 'series s-prev', d: path(prev) }, svg);
  svgEl('path', { class: 'series s-cur', d: path(cur) }, svg);
  svgEl('circle', { class: 'end', cx: x(n - 1), cy: y(cur[n - 1]), r: 4 }, svg);
  svgEl('text', { class: 'end-label', x: x(n - 1) + 10, y: y(cur[n - 1]) + 4 }, svg).textContent = cur[n - 1] + '억';
  const cross = svgEl('line', { class: 'cross', y1: T, y2: H - B }, svg);
  const d1 = svgEl('circle', { class: 'hover-dot', r: 5, fill: 'var(--accent)' }, svg);
  const d2 = svgEl('circle', { class: 'hover-dot', r: 5, fill: 'var(--text-muted)' }, svg);
  const hit = svgEl('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent', tabindex: 0, 'aria-label': '그래프 위를 움직이거나 좌우 화살표로 월별 값을 확인' }, svg);
  let idx = n - 1;
  const show = i => {
    idx = Math.max(0, Math.min(n - 1, i));
    box.classList.add('is-hover');
    cross.setAttribute('x1', x(idx)); cross.setAttribute('x2', x(idx));
    d1.setAttribute('cx', x(idx)); d1.setAttribute('cy', y(cur[idx]));
    d2.setAttribute('cx', x(idx)); d2.setAttribute('cy', y(prev[idx]));
    const diff = ((cur[idx] / prev[idx] - 1) * 100).toFixed(1);
    tip.innerHTML = `<b>${labels[idx]}</b><div class="row"><span class="key"><i style="background:var(--accent)"></i>2026년</span><span>${cur[idx]}억</span></div><div class="row"><span class="key"><i style="background:var(--text-muted)"></i>2025년</span><span>${prev[idx]}억</span></div><div class="row"><span class="key">증감</span><span>+${diff}%</span></div>`;
    const r = svg.getBoundingClientRect(), s = r.width / W;
    let left = x(idx) * s + 12;
    if (left + 160 > r.width) left = x(idx) * s - 172;
    tip.style.left = left + 'px'; tip.style.top = (y(cur[idx]) * s - 20) + 'px';
    tip.classList.add('on');
  };
  const hide = () => { box.classList.remove('is-hover'); tip.classList.remove('on'); };
  hit.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    show(Math.round((px - L) / ((W - L - R) / (n - 1))));
  });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(idx));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
  });
  $('#line-table').innerHTML = `<table><thead><tr><th scope="col">월</th><th scope="col" class="r">2026년 (억 원)</th><th scope="col" class="r">2025년 (억 원)</th><th scope="col" class="r">증감</th></tr></thead><tbody>${labels.map((m, i) => `<tr><td>${m}</td><td class="r">${cur[i]}</td><td class="r">${prev[i]}</td><td class="r">+${((cur[i] / prev[i] - 1) * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`;
}

function renderBars() {
  const rows = DATA.channels[range];
  const box = $('#bars'), svg = $('svg', box), tip = $('.tip', box);
  svg.replaceChildren();
  const W = 360, L = 88, R = 44, rowH = 52, barH = 20;
  const x = v => (W - L - R) * v / 50;
  rows.forEach(([name, v], i) => {
    const g = svgEl('g', { class: 'bar-row', tabindex: 0, role: 'img', 'aria-label': `${name} ${v}%` }, svg);
    const cy = 8 + i * rowH;
    svgEl('rect', { class: 'bar-hit', x: 0, y: cy - 8, width: W, height: rowH }, g);
    svgEl('text', { class: 'bar-name', x: L - 12, y: cy + 15, 'text-anchor': 'end' }, g).textContent = name;
    const w = Math.max(x(v), 6);
    svgEl('path', { class: 'bar', d: `M${L},${cy}h${w - 4}a4,4 0 0 1 4,4v${barH - 8}a4,4 0 0 1 -4,4h${-(w - 4)}z` }, g);
    svgEl('text', { class: 'bar-val', x: L + w + 8, y: cy + 15 }, g).textContent = v + '%';
    const on = () => {
      const r = svg.getBoundingClientRect(), s = r.width / W;
      tip.innerHTML = `<b>${name}</b><div class="row"><span class="key">비중</span><span>${v}%</span></div><div class="row"><span class="key">매출</span><span>${(sum(DATA.revenue.slice(-range)) * v / 100).toFixed(1)}억</span></div>`;
      tip.style.left = Math.min((L + w) * s + 8, r.width - 150) + 'px'; tip.style.top = (cy * s + 28) + 'px';
      tip.classList.add('on');
    };
    const off = () => tip.classList.remove('on');
    g.addEventListener('pointerenter', on); g.addEventListener('pointerleave', off);
    g.addEventListener('focus', on); g.addEventListener('blur', off);
  });
  $('#bars-table').innerHTML = `<table><thead><tr><th scope="col">채널</th><th scope="col" class="r">비중</th></tr></thead><tbody>${rows.map(([n, v]) => `<tr><td>${n}</td><td class="r">${v}%</td></tr>`).join('')}</tbody></table>`;
}

function renderProducts() {
  $('#top-products').innerHTML = DATA.products[range].map(([name, cat, rev, ord, sell], i) =>
    `<tr><td class="num">${i + 1}</td><td>${name}</td><td class="muted">${cat}</td><td class="r">${rev.toFixed(1)}억</td><td class="r">${fmt.format(ord)}</td><td><span class="meter" aria-hidden="true"><i style="width:${sell}%"></i></span><span class="num">${sell}%</span></td></tr>`).join('');
}

function renderAll() { renderKpis(); renderLine(); renderBars(); renderProducts(); }

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  range = +b.dataset.range;
  syncRange();
  const u = new URL(location.href); u.searchParams.set('range', range); history.replaceState(null, '', u);
  renderAll();
}));
function syncRange() {
  document.querySelectorAll('.seg button').forEach(o => o.setAttribute('aria-pressed', String(+o.dataset.range === range)));
}
document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.toggle, asTable = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', String(asTable));
  $('#' + id).hidden = asTable; $('#' + id + '-table').hidden = !asTable;
  $('span', b).textContent = asTable ? '그래프로 보기' : '표로 보기';
  $('use', b).setAttribute('href', asTable ? '#i-chart' : '#i-table');
}));
syncRange();
renderAll();
</script>
</body>
</html>
