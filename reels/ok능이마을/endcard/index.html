<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혜택지도 엔딩카드</title>
<style>
@font-face { font-family: "Pretendard Variable"; src: url("assets/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; }
* { box-sizing: border-box; margin: 0; }
html, body { background: #0E1A14; }
body { font-family: "Pretendard Variable", system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }

/* 의정부혜택지도 홍보 영상과 같은 팔레트 (promo-video/README.md) */
#stage {
  --v-text: #0E1A14; --v-muted: #4C5B53; --v-green: #00A86B; --v-green-ink: #00804F; --v-yellow: #FFD43B; --v-line: #DCE9E1;
  width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #0E1A14; color: #FFFFFF;
}
#bg { position: absolute; inset: 0; background: var(--v-green); }
.abs { position: absolute; }
.ln { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
.ln > span { display: inline-block; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; fill: currentColor; }
.ico svg { width: 100%; height: 100%; display: block; }

.label {
  left: 96px; top: 170px; display: inline-flex; align-items: center; gap: 14px; height: 88px; padding: 0 36px;
  border-radius: 999px; background: var(--v-text); font-size: 42px; font-weight: 700;
}
.label .ico { color: var(--v-yellow); font-size: 48px; }
.store { left: 96px; right: 96px; top: 300px; font-size: 128px; font-weight: 800; line-height: 1.12; letter-spacing: -0.035em; }

.card {
  left: 96px; right: 96px; top: 610px; padding: 56px 60px 60px; border-radius: 40px; background: #FFFFFF; color: var(--v-text);
  box-shadow: 0 24px 72px rgba(0,0,0,.18);
}
.menus { display: flex; gap: 12px; }
.menu {
  display: inline-flex; align-items: center; gap: 8px; height: 88px; padding: 0 22px; border-radius: 999px;
  border: 3px solid var(--v-line); font-size: 40px; font-weight: 700;
}
.menu .ico { color: var(--v-green-ink); font-size: 40px; }
.when { margin-top: 44px; font-size: 52px; font-weight: 700; color: var(--v-muted); }
.big { display: flex; align-items: baseline; gap: 20px; margin-top: 4px; }
.pct { font-size: 260px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.pct small { font-size: 0.55em; }
.off { font-size: 120px; font-weight: 800; letter-spacing: -0.03em; position: relative; z-index: 0; }
.off::before {
  content: ""; position: absolute; left: -0.06em; right: -0.06em; bottom: 0.1em; height: 0.42em;
  background: var(--v-yellow); z-index: -1; transform-origin: 0 50%; transform: scaleX(var(--m, 0));
}

.cafe-cap { left: 96px; right: 96px; top: 1260px; font-size: 46px; font-weight: 700; }
.search {
  left: 96px; right: 96px; top: 1340px; height: 150px; border-radius: 32px; background: #FFFFFF; color: var(--v-text);
  display: flex; align-items: center; gap: 20px; padding: 0 36px 0 24px; font-size: 54px; font-weight: 800;
}
.chip { height: 96px; padding: 0 26px; border-radius: 20px; background: var(--v-text); color: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 36px; font-weight: 700; flex: none; }
.chip .ico { color: var(--v-yellow); font-size: 42px; }
.search .ico.s { margin-left: auto; font-size: 60px; color: var(--v-green-ink); flex: none; }
.caret { width: 5px; height: 60px; background: var(--v-green); display: inline-block; margin-left: -12px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="abs label" id="label"><span class="ico" data-icon="map-pin"></span>의정부혜택지도 가맹점</div>
  <div class="abs store">
    <span class="ln"><span data-in="0.45">호원동</span></span>
    <span class="ln"><span data-in="0.6">OK능이마을</span></span>
  </div>
  <div class="abs card" id="card">
    <div class="menus">
      <span class="menu" data-pop="1.25"><span class="ico" data-icon="check-circle"></span>백숙류</span>
      <span class="menu" data-pop="1.4"><span class="ico" data-icon="check-circle"></span>해신탕</span>
      <span class="menu" data-pop="1.55"><span class="ico" data-icon="check-circle"></span>로스구이류</span>
    </div>
    <div class="when" id="when">식사 시</div>
    <div class="big"><span class="pct" id="pct">10<small>%</small></span><span class="off" id="off">할인</span></div>
  </div>
  <div class="abs cafe-cap" id="cafeCap">혜택 자세히 보기는 네이버카페에서</div>
  <div class="abs search" id="search">
    <span class="chip"><span class="ico" data-icon="users-three"></span>네이버카페</span>
    <span id="q"></span><i class="caret" id="caret"></i>
    <span class="ico s" data-icon="magnifying-glass"></span>
  </div>
</div>
<script src="assets/icons.js"></script>
<script>
const DURATION = 5.5;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
$$('[data-icon]').forEach(el => { el.innerHTML = `<svg viewBox="0 0 256 256" aria-hidden="true">${ICONS[el.dataset.icon]}</svg>`; });
const clamp = x => Math.min(1, Math.max(0, x)), P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = x => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const QUERY = '의정부혜택지도';

function render(t) {
  $('#bg').style.clipPath = `circle(${eInOut(P(t, 0, 0.5)) * 120}% at 50% 60%)`;
  const lb = eOut(P(t, 0.3, 0.7));
  $('#label').style.opacity = lb; $('#label').style.transform = `translateY(${(1 - lb) * 30}px)`;
  $$('[data-in]').forEach(el => { const a = +el.dataset.in; el.style.transform = `translateY(${(1 - eExpo(P(t, a, a + 0.6))) * 110}%)`; });
  const c = P(t, 0.9, 1.4);
  $('#card').style.opacity = c; $('#card').style.transform = `translateY(${(1 - eOut(c)) * 80}px)`;
  $$('[data-pop]').forEach(el => { const a = +el.dataset.pop, p = P(t, a, a + 0.35); el.style.opacity = p; el.style.transform = `scale(${0.6 + 0.4 * eBack(p)})`; });
  // 10%가 크게 튀어나왔다가 자리 잡는다
  const w = P(t, 1.75, 2.0), pp = P(t, 1.8, 2.3);
  $('#when').style.opacity = w;
  $('#pct').style.opacity = clamp(pp * 3); $('#pct').style.transform = `scale(${0.4 + 0.6 * eBack(pp)})`; $('#pct').style.transformOrigin = '0 80%';
  $('#off').style.opacity = P(t, 2.2, 2.45);
  $('#off').style.setProperty('--m', eOut(P(t, 2.6, 2.95)));
  const s = eOut(P(t, 2.9, 3.3));
  $('#cafeCap').style.opacity = s; $('#search').style.opacity = s;
  $('#search').style.transform = `translateY(${(1 - s) * 40}px)`;
  $('#q').textContent = QUERY.slice(0, Math.floor(P(t, 3.3, 4.0) * QUERY.length + 0.001));
  $('#caret').style.opacity = t < 3.3 || Math.floor(t * 2.5) % 2 === 0 ? 1 : 0;
}
window.DURATION = DURATION; window.render = render;
if (!location.search.includes('render')) { const t0 = performance.now(); (function tick() { render(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(tick); })(); }
</script>
</body>
</html>
