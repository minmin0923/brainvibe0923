<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
  <title>AI 바이럴 주간 리포트</title>
  <meta name="description" content="인스타그램 국내외 AI 바이럴 콘텐츠를 1주 단위로 모으고 분석한 리포트">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F6F7F8;
      --border: #E4E6E9;
      --text: #111315;
      --text-muted: #5D636B;
      --accent: #0F6E5C;
      --accent-contrast: #FFFFFF;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0C0E;
        --surface: #141619;
        --border: #25282D;
        --text: #ECEDEF;
        --text-muted: #9AA0A8;
        --accent: #3FB59A;
        --accent-contrast: #06231D;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    h2, .item { scroll-margin-top: 16px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; transition: color 150ms var(--ease); }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .skip {
      position: absolute; left: 20px; top: -48px; padding: 8px 12px;
      background: var(--accent); color: var(--accent-contrast); border-radius: 8px; z-index: 10;
    }
    .skip:focus { top: 12px; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    section { margin-top: 64px; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* 머리말 */
    header.top { padding-top: 48px; }
    .eyebrow { font-size: 14px; color: var(--text-muted); margin: 0 0 12px; }
    h1 {
      font-size: 32px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700;
      margin: 0; text-wrap: balance;
    }
    h2 { font-size: 24px; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; margin: 0 0 24px; }
    h3 { font-size: 18px; line-height: 1.4; font-weight: 600; margin: 0; }
    .lede { color: var(--text-muted); max-width: 65ch; margin: 16px 0 0; }
    .week-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
    .week-row[hidden] { display: none; }
    .week-row label { font-size: 14px; color: var(--text-muted); }
    select {
      height: 44px; padding: 0 12px; font: inherit; font-size: 16px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

    /* 숫자 요약 */
    .stats {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0;
      border: 1px solid var(--border); border-radius: 12px; margin-top: 32px; overflow: hidden;
    }
    .stat { padding: 16px 20px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stat:nth-child(2n) { border-right: 0; }
    .stat:nth-last-child(-n+2) { border-bottom: 0; }
    .stat dt { font-size: 14px; color: var(--text-muted); }
    .stat dd { margin: 4px 0 0; font-size: 28px; font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* 핵심 요약 */
    .summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; max-width: 65ch; }
    .summary li { padding-left: 20px; position: relative; }
    .summary li::before {
      content: ""; position: absolute; left: 0; top: 0.75em; width: 8px; height: 1px; background: var(--text-muted);
    }

    /* 필터 */
    .filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .filter-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter-group .label { font-size: 14px; color: var(--text-muted); width: 40px; flex: none; }
    .chip-btn {
      height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px;
      border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;
      touch-action: manipulation; transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .chip-btn:hover { border-color: var(--text-muted); }
    .chip-btn:active { background: var(--surface); }
    .chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
    .result-count { font-size: 14px; color: var(--text-muted); margin: 0 0 12px; }

    /* 사례 목록 */
    .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    .item { border-bottom: 1px solid var(--border); }
    .item details > summary {
      list-style: none; cursor: pointer; padding: 20px 0; display: grid; gap: 8px;
      grid-template-columns: minmax(0, 1fr) auto; align-items: start;
    }
    .item details > summary::-webkit-details-marker { display: none; }
    .item details > summary:hover h3 { color: var(--accent); }
    .item h3 { transition: color 150ms var(--ease); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--text-muted); }
    .tag {
      display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13px; color: var(--text-muted); white-space: nowrap;
    }
    .tag.peak { color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .chev {
      width: 24px; height: 24px; margin-top: 2px; color: var(--text-muted);
      transition: transform 200ms var(--ease);
    }
    details[open] .chev { transform: rotate(180deg); }
    .detail { padding: 0 0 32px; display: grid; gap: 24px; }
    .detail p { margin: 0; max-width: 65ch; }
    .detail h4 { font-size: 14px; font-weight: 600; color: var(--text-muted); margin: 0 0 8px; }
    .detail ul { margin: 0; padding-left: 20px; max-width: 65ch; }
    .detail li + li { margin-top: 4px; }
    .idea { background: var(--surface); border-radius: 12px; padding: 16px 20px; }
    .idea p { color: var(--text); }
    .sources { list-style: none; padding: 0 !important; display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .muted { color: var(--text-muted); }
    .empty { padding: 32px 0; color: var(--text-muted); }

    /* 패턴 */
    .patterns { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; border-top: 1px solid var(--border); }
    .pattern { padding: 24px 0; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
    .pattern .idx { font-family: var(--mono); font-size: 14px; color: var(--text-muted); }
    .pattern p { margin: 0; max-width: 65ch; }
    .pattern .refs { font-size: 14px; color: var(--text-muted); }
    .link-btn {
      background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer;
      text-align: left;
    }
    .link-btn:hover { text-decoration: underline; }

    .next { margin: 0; padding-left: 20px; max-width: 65ch; }
    .next li + li { margin-top: 8px; }
    .method { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 65ch; font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    footer { margin: 96px 0 48px; font-size: 14px; color: var(--text-muted); }

    @media (min-width: 768px) {
      .wrap { padding: 0 32px; }
      header.top { padding-top: 64px; }
      h1 { font-size: 44px; }
      h2 { font-size: 32px; }
      h3 { font-size: 20px; }
      body { font-size: 17px; }
      section { margin-top: 96px; }
      .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .stat { border-bottom: 0; }
      .stat:nth-child(2n) { border-right: 1px solid var(--border); }
      .stat:last-child { border-right: 0; }
      .filters { flex-direction: row; gap: 32px; }
      .patterns { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }
    }
    @media (min-width: 1024px) {
      .layout { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 32px; }
      .layout > .main { grid-column: 1 / span 12; }
      .detail { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }
      .detail .full { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#items-title">사례 목록으로 건너뛰기</a>
  <div class="wrap">
    <header class="top">
      <p class="eyebrow" id="period">기간</p>
      <h1>인스타그램 AI 바이럴 주간 리포트</h1>
      <p class="lede">국내외에서 지난 1주 동안 퍼진 AI 콘텐츠를 모으고, 왜 퍼졌는지와 우리 채널에서 어떻게 만들지 정리합니다.</p>
      <div class="week-row" id="week-row" hidden>
        <label for="week-select">주차</label>
        <select id="week-select" name="week"></select>
      </div>
      <dl class="stats" id="stats"></dl>
    </header>

    <main>
      <section aria-labelledby="summary-title">
        <h2 id="summary-title">이번 주 요약</h2>
        <ul class="summary" id="summary"></ul>
      </section>

      <section aria-labelledby="items-title">
        <h2 id="items-title" tabindex="-1">사례</h2>
        <div class="filters" role="group" aria-label="사례 필터">
          <div class="filter-group" data-filter="region">
            <span class="label">지역</span>
            <button type="button" class="chip-btn" data-value="all" aria-pressed="true">전체</button>
            <button type="button" class="chip-btn" data-value="kr" aria-pressed="false">국내</button>
            <button type="button" class="chip-btn" data-value="global" aria-pressed="false">해외</button>
          </div>
          <div class="filter-group" data-filter="status">
            <span class="label">상태</span>
            <button type="button" class="chip-btn" data-value="all" aria-pressed="true">전체</button>
            <button type="button" class="chip-btn" data-value="peak" aria-pressed="false">이번 주 정점</button>
            <button type="button" class="chip-btn" data-value="ongoing" aria-pressed="false">확산 중</button>
            <button type="button" class="chip-btn" data-value="reference" aria-pressed="false">참고</button>
          </div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <ul class="items" id="items"></ul>
      </section>

      <section aria-labelledby="patterns-title">
        <h2 id="patterns-title">공통 패턴</h2>
        <div class="patterns" id="patterns"></div>
      </section>

      <section aria-labelledby="next-title">
        <h2 id="next-title">다음에 할 일</h2>
        <ol class="next" id="next"></ol>
      </section>

      <section aria-labelledby="method-title">
        <h2 id="method-title">수집 방법과 한계</h2>
        <p class="method" id="method"></p>
      </section>
    </main>

    <footer>데이터 파일: <span class="num">trend-report/data.js</span>. 작성 규칙은 같은 폴더의 README.md를 보세요.</footer>
  </div>

  <script src="data.js"></script>
  <script>
    (function () {
      var reports = window.TREND_REPORTS || [];
      var REGION = { kr: "국내", global: "해외", both: "국내외" };
      var STATUS = { peak: "이번 주 정점", ongoing: "확산 중", reference: "참고" };
      var EVIDENCE = { metric: "수치 확인", press: "보도로 확인", unverified: "확인 필요" };
      var state = { report: null, reportIndex: 0, region: "all", status: "all" };
      var $ = function (id) { return document.getElementById(id); };

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        if (attrs) Object.keys(attrs).forEach(function (k) {
          if (k === "text") node.textContent = attrs[k];
          else if (k === "class") node.className = attrs[k];
          else node.setAttribute(k, attrs[k]);
        });
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
      }
      function list(items, cls) {
        return el("ul", cls ? { class: cls } : null, items.map(function (t) { return el("li", { text: t }); }));
      }
      function block(title, content, full) {
        return el("div", full ? { class: "full" } : null, [el("h4", { text: title }), content]);
      }
      var dateFmt = new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
      function fmtDate(d) { return dateFmt.format(new Date(d + "T00:00:00Z")); }

      // 필터, 주차, 펼친 사례를 주소에 남겨서 링크로 공유할 수 있게 한다.
      function writeUrl(itemId) {
        var q = new URLSearchParams();
        if (state.reportIndex) q.set("week", state.report.id);
        if (state.region !== "all") q.set("region", state.region);
        if (state.status !== "all") q.set("status", state.status);
        if (itemId) q.set("item", itemId);
        var qs = q.toString();
        history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
      }

      function matches(item) {
        var regionOk = state.region === "all" || item.region === state.region || item.region === "both";
        var statusOk = state.status === "all" || item.status === state.status;
        return regionOk && statusOk;
      }

      function renderItem(item) {
        var chev = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        chev.setAttribute("viewBox", "0 0 256 256");
        chev.setAttribute("class", "chev");
        chev.setAttribute("aria-hidden", "true");
        chev.innerHTML = '<polyline points="208 96 128 176 48 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>';

        var meta = el("div", { class: "meta" }, [
          el("span", { class: "tag" + (item.status === "peak" ? " peak" : ""), text: STATUS[item.status] }),
          el("span", { class: "tag", text: REGION[item.region] }),
          el("span", { class: "tag", text: item.type }),
          el("span", { class: "tag", text: EVIDENCE[item.evidence] })
        ]);
        var head = el("div", null, [el("h3", { text: item.title }), meta]);
        var summary = el("summary", null, [head, chev]);

        var facts = list([
          "계정: " + item.account,
          "처음 보인 때: " + item.firstSeen,
          "정점: " + item.peak
        ]);
        var metrics = item.metrics.length
          ? list(item.metrics)
          : el("p", { class: "muted", text: "확인된 수치 없음" });
        var sources = el("ul", { class: "sources" }, item.sources.map(function (s) {
          return el("li", null, [el("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", text: s.label })]);
        }));

        var detail = el("div", { class: "detail" }, [
          block("어떤 영상인가", el("p", { text: item.what }), true),
          block("확인된 수치", metrics),
          block("기본 정보", facts),
          block("왜 퍼졌나", list(item.why)),
          block("주의할 점", el("p", { text: item.caution })),
          el("div", { class: "idea full" }, [el("h4", { text: "우리 채널에서 만든다면" }), el("p", { text: item.idea })]),
          block("인스타그램에서 직접 확인할 것", el("p", { text: item.checkOnInstagram })),
          block("출처", sources)
        ]);

        var details = el("details", null, [summary, detail]);
        details.addEventListener("toggle", function () { if (details.open) writeUrl(item.id); });
        return el("li", { class: "item", id: "item-" + item.id }, [details]);
      }

      function renderItems() {
        var r = state.report;
        var ul = $("items");
        ul.textContent = "";
        var shown = r.items.filter(matches);
        shown.forEach(function (it) { ul.appendChild(renderItem(it)); });
        if (!shown.length) ul.appendChild(el("li", { class: "empty", text: "조건에 맞는 사례가 없습니다." }));
        $("result-count").textContent = "사례 " + shown.length + "개 / 전체 " + r.items.length + "개";
      }

      function openItem(id) {
        state.region = "all"; state.status = "all"; syncFilters(); renderItems();
        var li = $("item-" + id);
        if (!li) return;
        var d = li.querySelector("details");
        d.open = true;
        d.querySelector("summary").focus();
        li.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      }

      function renderReport(r) {
        state.report = r;
        $("period").textContent = r.title + " · " + fmtDate(r.periodStart) + " ~ " + fmtDate(r.periodEnd);
        var counts = {
          total: r.items.length,
          peak: r.items.filter(function (i) { return i.status === "peak"; }).length,
          kr: r.items.filter(function (i) { return i.region === "kr" || i.region === "both"; }).length,
          metric: r.items.filter(function (i) { return i.evidence === "metric"; }).length
        };
        var stats = $("stats");
        stats.textContent = "";
        [["전체 사례", counts.total], ["이번 주 정점", counts.peak], ["국내 관련", counts.kr], ["수치 확인", counts.metric]]
          .forEach(function (s) {
            stats.appendChild(el("div", { class: "stat" }, [el("dt", { text: s[0] }), el("dd", { text: String(s[1]) })]));
          });

        var sum = $("summary"); sum.textContent = "";
        r.summary.forEach(function (t) { sum.appendChild(el("li", { text: t })); });

        var pat = $("patterns"); pat.textContent = "";
        r.patterns.forEach(function (p, i) {
          var refs = el("div", { class: "refs" }, [document.createTextNode("관련 사례: ")]);
          p.examples.forEach(function (id, j) {
            var it = r.items.filter(function (x) { return x.id === id; })[0];
            if (!it) return;
            if (j) refs.appendChild(document.createTextNode(", "));
            var b = el("button", { type: "button", class: "link-btn", text: it.title.split(",")[0] });
            b.addEventListener("click", function () { openItem(id); });
            refs.appendChild(b);
          });
          pat.appendChild(el("div", { class: "pattern" }, [
            el("span", { class: "idx", text: String(i + 1).padStart(2, "0") }),
            el("h3", { text: p.title }),
            el("p", { text: p.body }),
            refs
          ]));
        });

        var next = $("next"); next.textContent = "";
        r.nextActions.forEach(function (t) { next.appendChild(el("li", { text: t })); });
        $("method").textContent = r.method + " 수집일: " + fmtDate(r.collectedAt) + ".";
        renderItems();
      }

      function syncFilters() {
        document.querySelectorAll(".filter-group").forEach(function (g) {
          var key = g.getAttribute("data-filter");
          g.querySelectorAll(".chip-btn").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.getAttribute("data-value") === state[key]));
          });
        });
      }

      document.querySelectorAll(".filter-group").forEach(function (g) {
        var key = g.getAttribute("data-filter");
        g.addEventListener("click", function (e) {
          var b = e.target.closest(".chip-btn");
          if (!b) return;
          state[key] = b.getAttribute("data-value");
          syncFilters();
          renderItems();
          writeUrl();
        });
      });

      if (!reports.length) {
        $("items").appendChild(el("li", { class: "empty", text: "data.js에 리포트가 없습니다." }));
        return;
      }
      if (reports.length > 1) {
        var sel = $("week-select");
        reports.forEach(function (r, i) { sel.appendChild(el("option", { value: String(i), text: r.title })); });
        sel.addEventListener("change", function () {
          state.reportIndex = Number(sel.value);
          renderReport(reports[state.reportIndex]);
          writeUrl();
        });
        $("week-row").hidden = false;
      }
      var params = new URLSearchParams(location.search);
      state.reportIndex = Math.max(0, reports.findIndex(function (r) { return r.id === params.get("week"); }));
      if (REGION[params.get("region")]) state.region = params.get("region");
      if (STATUS[params.get("status")]) state.status = params.get("status");
      syncFilters();
      if (reports.length > 1) $("week-select").value = String(state.reportIndex);
      renderReport(reports[state.reportIndex]);
      if (params.get("item")) openItem(params.get("item"));
    })();
  </script>
</body>
</html>
